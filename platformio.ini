; PlatformIO Project Configuration File for FluidTouch
; Elecrow CrowPanel 7" ESP32 HMI Display (Basic and Advance versions)
; Product URLs:
;   Basic: https://www.awin1.com/cread.php?awinmid=82721&awinaffid=2663106&ued=https%3A%2F%2Fwww.elecrow.com%2Fesp32-display-7-inch-hmi-display-rgb-tft-lcd-touch-screen-support-lvgl.html
;   Advance: https://www.awin1.com/cread.php?awinmid=82721&awinaffid=2663106&ued=https%3A%2F%2Fwww.elecrow.com%2Fcrowpanel-advance-7-0-hmi-esp32-ai-display-800x480-artificial-intelligent-ips-touch-screen-support-meshtastic-and-arduino-lvgl-micropython.html
[platformio]
default_envs = esp32-p4-evboard

; Common settings for both hardware versions
[env]
; Common build flags
build_flags = 
    -DBOARD_HAS_PSRAM
    -I include
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DVERSION=\"1.0.1\"

; Common library dependencies
lib_deps = 
    links2004/WebSockets@^2.7.1
    bblanchon/ArduinoJson@^7.4.2

[env:esp32-p4-evboard]
platform = https://github.com/pioarduino/platform-espressif32.git#main
board = esp32-p4-evboard
framework = arduino, espidf
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
build_type = debug
board_build.sdkconfig = sdkconfig.esp32-p4-evboard
board_build.partitions = partitions.csv
upload_protocol = esptool
;upload_command = $PYTHONEXE $UPLOADER --chip esp32p4 write-flash --flash-mode dio --flash-freq 80m --flash-size 16MB 0x1000 $PROJECT_BUILD_DIR/$PIOENV/bootloader.bin 0x8000 $PROJECT_BUILD_DIR/$PIOENV/partitions.bin 0x10000 $PROJECT_BUILD_DIR/$PIOENV/firmware.bin
build_flags =
    ${env.build_flags}
    -I../lib/esp-bsp/bsp/esp32_p4_function_ev_board/include
    -DHARDWARE_BASIC
    -DLV_USE_OS=LV_OS_FREERTOS
    -DBSP_DISABLE_CAMERA
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DENABLE_SCREENSHOT_SERVER=false
    -DFT_WIFI_ENABLED=1
build_src_filter =
    +<*>
    -<pc/**>

[env:emulator_64bits]
platform = native@^1.1.3
build_type = debug
extra_scripts =
  pre:../lv_platformio/support/sdl2_paths.py
  post:../lv_platformio/support/sdl2_build_extra.py
build_flags =
    -D LV_CONF_SKIP
    -D LV_CONF_INCLUDE_SIMPLE
    -D FT_PLATFORM_PC
    -D FT_WIFI_ENABLED=0
    -D ENABLE_SCREENSHOT_SERVER=0
    -I src/pc/compat
    -D LV_USE_SDL=1
    -D LV_FONT_MONTSERRAT_12=1
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_16=1
    -D LV_FONT_MONTSERRAT_18=1
    -D LV_FONT_MONTSERRAT_20=1
    -D LV_FONT_MONTSERRAT_22=1
    -D LV_FONT_MONTSERRAT_24=1
    -D LV_FONT_MONTSERRAT_26=1
    -D LV_FONT_MONTSERRAT_28=1
    -D LV_FONT_MONTSERRAT_32=1
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D LV_DRV_NO_CONF
    -D SDL_ZOOM=1
    -D LV_SDL_INCLUDE_PATH="\"SDL2/SDL.h\""
    -lSDL2
    -D LV_MEM_SIZE="(64U * 1024U * 1024U)"
build_src_filter =
    +<pc/**>
    +<env/common/**>
    +<env/pc/**>
    +<ui/**>
    -<main.cpp>
    -<core/**>
    -<network/**>
    +<core/qtdial_button_mapping.cpp>
lib_deps =
    lvgl@9.3
    bblanchon/ArduinoJson@^7.4.2

[env:emulator_rpi]
extends = env:emulator_64bits
; Cross-compile the SDL emulator for Raspberry Pi.
; Defaults to arm-linux-gnueabihf, override with FT_RPI_TRIPLET if needed
; (for example: aarch64-linux-gnu).
extra_scripts =
  pre:../lv_platformio/support/sdl2_paths.py
  post:scripts/pio_rpi_cross.py
  post:../lv_platformio/support/sdl2_build_extra.py
build_unflags =
    -lSDL2

[env:rpi_circle]
platform = native@^1.1.3
build_type = release
extra_scripts =
  pre:scripts/pio_circle_env.py
lib_deps =
    ${env.lib_deps}
build_flags =
    ${env.build_flags}
    -D FT_PLATFORM_RPI
    -D FT_WIFI_ENABLED=0
    -D ENABLE_SCREENSHOT_SERVER=0
    -I src/env/rpi/compat
    -I src/pc/compat
build_src_filter =
    -<*>
    +<rpi_circle/pio_dummy.cpp>
custom_circle_aarch = 64
custom_circle_rasppi = 4
custom_circle_prefix32 = arm-none-eabi-
custom_circle_prefix64 = aarch64-none-elf-

[env:rpi_circle_dev]
extends = env:rpi_circle
build_type = debug
custom_circle_netboot = 1

[env:rpi_circle_smoke]
extends = env:rpi_circle
build_src_filter =
    -<*>
    +<rpi_circle_smoke/pio_dummy.cpp>
custom_circle_source_dir = src/rpi_circle_smoke
